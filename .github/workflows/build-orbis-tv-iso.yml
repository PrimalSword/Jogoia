name: Build Orbis TV ISO

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'orbis-tv/**'
      - 'ORBIS_TV_ACER.md'
      - '.github/workflows/build-orbis-tv-iso.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 75

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Orbis TV 0.3 hybrid BIOS/UEFI image on Bookworm
        run: |
          docker run --rm --privileged \
            -v "$PWD:/work" \
            -w /work \
            debian:bookworm \
            bash -lc '
              set -e
              apt-get update
              DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
                live-build debootstrap debian-archive-keyring xorriso isolinux \
                syslinux-common syslinux-utils squashfs-tools dosfstools mtools \
                grub-efi-amd64-bin grub-pc-bin shim-signed ca-certificates
              chmod +x orbis-tv/build-live.sh
              ./orbis-tv/build-live.sh
            '

      - name: Verify BIOS and UEFI boot image
        run: |
          ls -lh dist/orbistv-*
          docker run --rm             -v "$PWD:/work"             -w /work             debian:bookworm             bash -lc '
              set -e
              apt-get update >/dev/null
              DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends xorriso >/dev/null
              xorriso -indev dist/orbistv-0.3.0-amd64.iso -report_el_torito plain | tee /tmp/el-torito.txt
              xorriso -indev dist/orbistv-0.3.0-amd64.iso -report_system_area plain | tee /tmp/system-area.txt
              grep -qi 'BIOS' /tmp/el-torito.txt
              grep -qi 'UEFI\|EFI' /tmp/el-torito.txt
            '

      - name: Show generated files
        run: ls -lh dist/orbistv-*

      - name: Upload Orbis TV ISO
        uses: actions/upload-artifact@v4
        with:
          name: OrbisTV-0.3.0-hybrid-amd64
          path: |
            dist/orbistv-0.3.0-amd64.iso
            dist/orbistv-0.3.0-amd64.iso.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
