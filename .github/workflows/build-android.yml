name: Gerar APK Android

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    name: Compilar APK
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o projeto
        uses: actions/checkout@v4

      - name: Preparar Android SDK
        uses: android-actions/setup-android@v3

      - name: Exportar pelo Godot
        id: export
        uses: firebelley/godot-export@v7.0.0
        with:
          godot_executable_download_url: https://github.com/godotengine/godot-builds/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          godot_export_templates_download_url: https://github.com/godotengine/godot-builds/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz
          relative_project_path: ./
          presets_to_export: Android
          use_preset_export_path: true
          archive_output: false

      - name: Publicar APK para download
        uses: actions/upload-artifact@v4
        with:
          name: ECO-Ultimo-Toque-Android
          path: ${{ steps.export.outputs.build_directory }}/**/*.apk
          if-no-files-found: error
          retention-days: 30
