name: Build OrbisOS ISO

on:
  workflow_dispatch:
  push:
    branches:
      - orbis-os
    paths:
      - 'orbis-build.sh'
      - '.github/workflows/build-orbis-iso.yml'
      - 'ORBISOS.md'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    container:
      image: debian:trixie-slim
    timeout-minutes: 60

    steps:
      - name: Install build tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates git live-build debootstrap xorriso \
            isolinux syslinux-common squashfs-tools

      - name: Checkout
        uses: actions/checkout@v4

      - name: Build OrbisOS
        run: |
          chmod +x orbis-build.sh
          ./orbis-build.sh

      - name: Show generated files
        run: ls -lh dist/

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: OrbisOS-0.1-amd64
          path: |
            dist/*.iso
            dist/*.sha256
          if-no-files-found: error
          retention-days: 14
